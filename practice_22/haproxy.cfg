global
   daemon
   maxconn 256

defaults
   mode http
   timeout connect 5000ms
   timeout client 50000ms
   timeout server 50000ms

frontend http_front
    bind *:8080
   default_backend http_back

backend http_back
   balance roundrobin
   option httpchk GET /health

   server server1 host.docker.internal:3000 check inter 2000 rise 2 fall 2

   server server2 host.docker.internal:3002 check inter 2000 rise 2 fall 2

   server server3 host.docker.internal:3003 check backup

